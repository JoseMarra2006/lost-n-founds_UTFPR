{% extends 'base.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="caixa caixa-estreita">
    <h1>Entrar</h1>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            {% for erro in form.non_field_errors %}
                <p class="erro">E-mail ou senha incorretos.</p>
            {% endfor %}
        {% endif %}

        <div class="campo">
            <label for="id_username">E-mail</label>
            <input type="email" name="username" id="id_username" autocomplete="username" required autofocus>
        </div>

        <div class="campo">
            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="botao">Entrar</button>
    </form>

    <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
